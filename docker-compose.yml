services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: security-qa-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
    networks: [dast]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    init: true
    network_mode: service:juice-shop
    depends_on:
      juice-shop:
        condition: service_healthy
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    volumes:
      - ./.zap:/zap/wrk/.zap:ro
      - ./reports/security/zap:/zap/wrk/reports:rw
    command: ["python3", "/zap/wrk/.zap/driver.py", "daemon"]
    healthcheck:
      test: ["CMD", "python3", "/zap/wrk/.zap/driver.py", "health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    stop_grace_period: 20s
  allure-security:
    image: eclipse-temurin:17-jre
    profiles: [security]
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: [java]
    command: ["-classpath", "/workspace/node_modules/allure-commandline/dist/lib/*:/workspace/node_modules/allure-commandline/dist/lib/config", "io.qameta.allure.CommandLine", "generate", "allure-results-security", "--clean", "-o", "allure-report-security"]

networks:
  dast:
    driver: bridge
